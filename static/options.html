<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>npm Downloads Corrected — Options</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #333; --strong: #111; --muted: #777; --accent: #8956ff; --border: #d9d9d9; --field: #fff;
      --error: #cb3837; --ok: #2e8b57; --track: #e4e4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6e6e6; --strong: #fff; --muted: #9a9a9a; --accent: #a98bff; --border: #444; --field: #1f1f1f; --error: #ff7b7a; --ok: #6cc98a; --track: #3a3a3a; }
    }
    body { margin: 0; padding: 16px 20px 20px; min-width: 360px; max-width: 520px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
    main.loading { visibility: hidden; }
    .field { margin: 0 0 18px; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    label { font-weight: 600; color: var(--strong); }
    .meta { display: flex; gap: 10px; font-size: 12px; white-space: nowrap; }
    .unsaved { color: var(--accent); }
    .unsaved::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 5px 1px 0; border-radius: 50%; background: var(--accent); }
    button.link { padding: 0; border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    button.link:hover { color: var(--accent); }
    textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); color: var(--fg); }
    textarea { resize: vertical; min-height: 60px; }
    textarea:focus, select:focus, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .invalid textarea, .invalid select { border-color: var(--error); }
    .slider { display: flex; align-items: center; gap: 12px; }
    input[type=range] { flex: 1; margin: 0; accent-color: var(--accent); }
    output { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--strong); }
    .hint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .hint b { color: var(--fg); font-weight: 600; }
    .error { margin-top: 4px; font-size: 12px; color: var(--error); }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border); }
    button.primary { padding: 7px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary:disabled { opacity: 0.45; cursor: default; }
    .status { margin-left: auto; font-size: 12px; color: var(--ok); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="options.js"></script>
</body>
</html>
