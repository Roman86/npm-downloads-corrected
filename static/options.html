<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>npm Downloads Corrected — Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #333; --strong: #111; --muted: #777; --accent: #8956ff; --border: #d9d9d9; --field: #fff;
      --error: #cb3837; --ok: #2e8b57; --track: #e4e4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6e6e6; --strong: #fff; --muted: #9a9a9a; --accent: #a98bff; --border: #444; --field: #1f1f1f; --error: #ff7b7a; --ok: #6cc98a; --track: #3a3a3a; }
    }
    body { margin: 0; padding: 16px 20px 0; min-width: 360px; max-width: 520px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
    main.loading { visibility: hidden; }
    .field { margin: 0 0 18px; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    label { font-weight: 600; color: var(--strong); }
    .meta { display: flex; gap: 10px; font-size: 12px; white-space: nowrap; }
    .unsaved { color: var(--accent); }
    .unsaved::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 5px 1px 0; border-radius: 50%; background: var(--accent); }
    button.link { padding: 0; border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    button.link:hover { color: var(--accent); }
    button.link:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
    button.link:disabled:hover { color: var(--muted); }
    textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); color: var(--fg); }
    textarea { resize: vertical; min-height: 60px; }
    textarea:focus, select:focus, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .invalid textarea, .invalid select { border-color: var(--error); }
    .slider { display: flex; align-items: center; gap: 12px; }
    input[type=range] { flex: 1; margin: 0; accent-color: var(--accent); }
    output { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--strong); }
    .group { margin: 0 0 18px; padding: 12px 14px 0; border: 1px solid var(--border); border-radius: 8px; }
    .group h2 { margin: 0 0 2px; font-size: 14px; color: var(--strong); }
    .group > .hint { margin: 0 0 10px; }
    .group .field { margin-bottom: 14px; }
    .zones { margin-bottom: 14px; }
    .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
    .z-fill { background: var(--error); }
    .z-scale { background: var(--accent); }
    .z-keep { background: var(--track); }
    .legend { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
    .legend li { display: flex; gap: 8px; margin-top: 3px; }
    .legend li b { color: var(--fg); white-space: nowrap; }
    .legend i { flex: none; width: 10px; height: 10px; margin-top: 4px; border-radius: 3px; }
    .hint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .hint b { color: var(--fg); font-weight: 600; }
    .error { margin-top: 4px; font-size: 12px; color: var(--error); }
    .actions { position: sticky; bottom: 0; display: flex; align-items: center; gap: 14px; margin: 22px -20px 0; padding: 12px 20px 14px; border-top: 1px solid var(--border); background: Canvas; }
    /* Edge shades: top of the page while content is scrolled past, above the
       sticky bar while there is content below the fold. */
    body::before, .actions::before { content: ''; position: absolute; left: 0; right: 0; height: 14px; background: linear-gradient(var(--shade), transparent); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    body::before { position: fixed; z-index: 1; top: 0; }
    .actions::before { bottom: 100%; background: linear-gradient(transparent, var(--shade)); }
    .more-above body::before, .more-below .actions::before { opacity: 1; }
    :root { --shade: rgba(0, 0, 0, 0.18); }
    @media (prefers-color-scheme: dark) { :root { --shade: rgba(0, 0, 0, 0.5); } }
    button.primary { padding: 7px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary:disabled { opacity: 0.45; cursor: default; }
    .status { margin-left: auto; font-size: 12px; color: var(--ok); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="options.js"></script>
</body>
</html>
